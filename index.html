<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCA Lookup &amp; Spring Cleanup</title>

<!-- PWA / iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MCA Lookup">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    min-height: -webkit-fill-available;
  }
  header {
    padding: 16px 16px 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    text-align: center;
    font-weight: 600;
    font-size: 17px;
    border-bottom: 1px solid #1e293b;
    background: #0f172a;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  #captcha, #login, #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }
  input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #f1f5f9;
    font-size: 16px;
    margin-bottom: 10px;
    -webkit-appearance: none;
  }
  input:focus { outline: none; border-color: #3b82f6; }
  button.primary {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: #3b82f6;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:active { background: #2563eb; }
  #login, #app { display: none; }
  .card { background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .card .name { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
  .card .co { color: #94a3b8; font-size: 13px; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; color: #cbd5e1; }
  .row a { color: #60a5fa; text-decoration: none; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 600;
    margin-top: 8px;
  }
  .badge.paid { background: #14532d; color: #86efac; }
  .badge.due  { background: #7f1d1d; color: #fca5a5; }
  .empty { text-align: center; color: #64748b; margin-top: 40px; font-size: 14px; }
  .err { color: #fca5a5; font-size: 14px; margin-top: 8px; }
  .label { color: #94a3b8; font-size: 14px; margin-bottom: 12px; }
  #captchaQuestion { font-size: 22px; font-weight: 600; margin-bottom: 12px; color: #f1f5f9; }
  .search-wrap { position: relative; }
  .search-wrap input { padding-right: 42px; }
  input[type="search"]::-webkit-search-cancel-button { display: none; }
  .dropoffs { margin-top: 12px; }
  .dropoffs .dlabel { color: #94a3b8; font-size: 12px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
  .dropoff-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .dbtn {
    padding: 12px 4px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #cbd5e1;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    line-height: 1.25;
    -webkit-tap-highlight-color: transparent;
  }
  .dbtn small { display: block; font-weight: 400; font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .dbtn:active { background: #1e293b; }
  .dbtn.done { background: #14532d; border-color: #166534; color: #bbf7d0; }
  .dbtn.done small { color: #86efac; }
  .dbtn:disabled { opacity: .6; cursor: default; }
  .dnote { color: #94a3b8; font-size: 12px; margin-top: 12px; }
  #summary {
    display: none;
    background: #1e293b;
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 13px;
    color: #cbd5e1;
  }
  #summary b { color: #f1f5f9; }
  #summary .sline { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  #clearBtn {
    display: none;
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-57%);
    width: 30px;
    height: 30px;
    padding: 0;
    border-radius: 50%;
    border: none;
    background: #334155;
    font-size: 16px;
    line-height: 1;
    color: #94a3b8;
    cursor: pointer;
  }
</style>
</head>
<body>
<header>Mirrormont Lookup &amp; Spring Cleanup</header>

<!-- Step 1: Math CAPTCHA -->
<div id="captcha">
  <p class="label">Please answer the question below to continue.</p>
  <div id="captchaQuestion"></div>
  <input id="captchaAnswer" type="number" inputmode="numeric" placeholder="Your answer"
         autocomplete="off" onkeydown="if(event.key==='Enter') checkCaptcha()">
  <button class="primary" onclick="checkCaptcha()">Continue</button>
  <div class="err" id="captchaErr"></div>
</div>

<!-- Step 2: Board access code -->
<div id="login">
  <p class="label">Enter the board access code.</p>
  <input id="code" type="password" placeholder="Access code" autocomplete="off"
         onkeydown="if(event.key==='Enter') doLogin()">
  <button class="primary" onclick="doLogin()">Enter</button>
  <div class="err" id="loginErr"></div>
</div>

<!-- Step 3: Search -->
<div id="app">
  <div id="summary"></div>
  <div class="search-wrap">
    <input id="q" type="search" placeholder="Search name, address, email, or phone…"
           oninput="onSearch()" autocomplete="off">
    <button id="clearBtn" onclick="clearSearch()">✕</button>
  </div>
  <div id="results"><div class="empty">Start typing to search members</div></div>
</div>

<script>
const API_BASE = 'https://www.mirrormont.org/_functions';
let ACCESS_CODE = localStorage.getItem('mca_code') || '';
let debounceTimer;
let captchaAnswer;
let CLEANUP_YEAR = new Date().getFullYear();
const memberStore = {};   // id -> member record from the latest search (kept so buttons can update in place)
const CATEGORIES = [
  { key: 'garbage',     label: 'Garbage' },
  { key: 'electronics', label: 'Electronics' },
  { key: 'styrofoam',   label: 'Styrofoam' }
];

// ── CAPTCHA ──────────────────────────────────────────────
function initCaptcha() {
  const a = Math.floor(Math.random() * 10) + 1;
  const b = Math.floor(Math.random() * 10) + 1;
  const ops = [
    { label: `${a} + ${b}`,       answer: a + b },
    { label: `${a + b} − ${b}`,   answer: a },
    { label: `${a} × ${b}`,       answer: a * b }
  ];
  const op = ops[Math.floor(Math.random() * ops.length)];
  captchaAnswer = op.answer;
  document.getElementById('captchaQuestion').textContent = `What is ${op.label}?`;
}

function checkCaptcha() {
  const val = parseInt(document.getElementById('captchaAnswer').value, 10);
  if (val === captchaAnswer) {
    document.getElementById('captcha').style.display = 'none';
    if (ACCESS_CODE) {
      showApp();
    } else {
      document.getElementById('login').style.display = 'block';
    }
  } else {
    document.getElementById('captchaErr').textContent = 'Incorrect — try again.';
    document.getElementById('captchaAnswer').value = '';
    initCaptcha();
  }
}

// ── LOGIN ─────────────────────────────────────────────────
async function doLogin() {
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  const code = document.getElementById('code').value.trim();
  try {
    const res = await fetch(API_BASE + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    if (!res.ok) { errEl.textContent = 'Server error: HTTP ' + res.status; return; }
    const data = await res.json();
    if (data.ok) {
      ACCESS_CODE = code;
      localStorage.setItem('mca_code', code);
      showApp();
    } else {
      errEl.textContent = data.error || 'Incorrect code.';
    }
  } catch (e) {
    errEl.textContent = 'Request failed: ' + e.message;
  }
}

function showApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('q').focus();
  loadSummary();
}

// ── SEARCH ────────────────────────────────────────────────
function clearSearch() {
  const input = document.getElementById('q');
  input.value = '';
  input.focus();
  document.getElementById('clearBtn').style.display = 'none';
  document.getElementById('results').innerHTML = '<div class="empty">Start typing to search members</div>';
}

function onSearch() {
  clearTimeout(debounceTimer);
  const q = document.getElementById('q').value.trim();
  document.getElementById('clearBtn').style.display = q.length ? 'block' : 'none';
  debounceTimer = setTimeout(() => runSearch(q), 300);
}

async function runSearch(q) {
  const resultsEl = document.getElementById('results');
  if (q.length < 2) {
    resultsEl.innerHTML = '<div class="empty">Start typing to search members</div>';
    return;
  }
  resultsEl.innerHTML = '<div class="empty">Searching…</div>';
  try {
    const res = await fetch(API_BASE + '/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Access-Code': ACCESS_CODE },
      body: JSON.stringify({ query: q })
    });
    if (res.status === 403) { localStorage.removeItem('mca_code'); location.reload(); return; }
    const data = await res.json();
    if (data.cleanupYear) CLEANUP_YEAR = data.cleanupYear;
    renderResults(data.results || []);
  } catch (e) {
    resultsEl.innerHTML = '<div class="empty">Search failed — check your connection.</div>';
  }
}

function renderResults(items) {
  const resultsEl = document.getElementById('results');
  if (!items.length) { resultsEl.innerHTML = '<div class="empty">No matches</div>'; return; }
  const thisYear = new Date().getFullYear();
  resultsEl.innerHTML = items.map(m => {
    const paid = m.latestPaidYear && parseInt(m.latestPaidYear, 10) >= thisYear;
    const coName = (m.coName || '').trim();
    return `
      <div class="card" id="card-${esc(m.id)}">
        <div class="name">${esc(m.name || 'Unnamed')}</div>
        ${coName ? `<div class="co">${esc(coName)}</div>` : ''}
        <div class="row"><span>Address</span><span>${esc(m.address || '—')}</span></div>
        ${m.phone ? `<div class="row"><span>Phone</span><a href="tel:${esc(m.phone)}">${esc(m.phone)}</a></div>` : ''}
        ${m.email ? `<div class="row"><span>Email</span><a href="mailto:${esc(m.email)}">${esc(m.email)}</a></div>` : ''}
        <div class="badge ${paid ? 'paid' : 'due'}">
          ${paid ? `Paid through ${esc(String(m.latestPaidYear || m.paidThrough))}` : `Dues due (last paid: ${esc(String(m.latestPaidYear || 'unknown'))})`}
        </div>
        ${dropoffHtml(m, paid)}
      </div>`;
  }).join('');
}

// ── SPRING CLEANUP DROP-OFFS ──────────────────────────────
function dropoffHtml(m, paid) {
  memberStore[m.id] = m;
  if (!paid) {
    return `<div class="dnote">Not eligible for ${CLEANUP_YEAR} spring cleanup until dues are paid.</div>`;
  }
  const d = m.dropoffs || {};
  const btns = CATEGORIES.map(c => {
    const at = d[c.key];
    return `<button class="dbtn ${at ? 'done' : ''}" data-id="${esc(m.id)}" data-cat="${c.key}"
              onclick="toggleDropoff(this)">${at ? '✓ ' : ''}${c.label}${at ? `<small>${esc(fmtTime(at))}</small>` : ''}</button>`;
  }).join('');
  return `<div class="dropoffs"><div class="dlabel">${CLEANUP_YEAR} spring cleanup drop-offs</div><div class="dropoff-btns">${btns}</div></div>`;
}

function fmtTime(iso) {
  const t = new Date(iso);
  if (isNaN(t)) return 'dropped';
  return t.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' +
         t.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

async function toggleDropoff(btn) {
  const id  = btn.dataset.id;
  const cat = btn.dataset.cat;
  const m   = memberStore[id];
  if (!m) return;
  const label = CATEGORIES.find(c => c.key === cat).label;
  const already = !!(m.dropoffs && m.dropoffs[cat]);

  // Un-flagging needs a confirm so a stray tap can't erase a record
  if (already && !confirm('Remove the ' + label + ' drop-off for ' + (m.name || 'this member') + '?')) return;

  // Disable this household's buttons while the request is in flight
  const card = document.getElementById('card-' + id);
  const group = card ? card.querySelectorAll('.dbtn') : [btn];
  group.forEach(b => b.disabled = true);

  try {
    const res = await fetch(API_BASE + '/dropoff', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Access-Code': ACCESS_CODE },
      body: JSON.stringify({ memberId: id, category: cat, dropped: !already })
    });
    if (res.status === 403) { localStorage.removeItem('mca_code'); location.reload(); return; }
    const data = await res.json();
    if (!data.ok) throw new Error((data.error || 'Could not save') + (data.detail ? ' — ' + data.detail : ''));
    m.dropoffs = data.dropoffs || {};
    if (card) {
      const old = card.querySelector('.dropoffs');
      if (old) old.outerHTML = dropoffHtml(m, true);
    }
    loadSummary();
  } catch (e) {
    alert('Could not save: ' + e.message);
    group.forEach(b => b.disabled = false);
  }
}

async function loadSummary() {
  const el = document.getElementById('summary');
  try {
    const res = await fetch(API_BASE + '/cleanup_summary', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Access-Code': ACCESS_CODE },
      body: '{}'
    });
    if (!res.ok) return;
    const data = await res.json();
    if (!data.ok) return;
    const t = data.totals || {};
    el.innerHTML = `<div class="sline"><span><b>${esc(String(data.year))} spring cleanup</b> · ${esc(String(data.households))} household${data.households === 1 ? '' : 's'}</span>` +
      `<span>Garbage <b>${t.garbage || 0}</b> · Electronics <b>${t.electronics || 0}</b> · Styrofoam <b>${t.styrofoam || 0}</b></span></div>`;
    el.style.display = 'block';
  } catch (_) { /* summary is optional */ }
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── INIT ──────────────────────────────────────────────────
initCaptcha();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('/service-worker.js').catch(() => {});
}
</script>
</body>
</html>
